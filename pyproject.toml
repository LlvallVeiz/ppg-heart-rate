[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-heart-rate"
version = "1.0.0"
description = "Synthetic PPG generation and heart-rate / HRV analysis (Elgendi-style peak detection)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.scripts]
ppg-heart-rate = "ppg_heart_rate.cli:main"

[tool.setuptools.packages.find]
include = ["ppg_heart_rate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
